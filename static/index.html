<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPUDashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #000;
    --border: #2e2e2e;
    --text: #d6d6d6;
    --muted: #7d7d7d;
    --dim: #3d3d3d;
    --green: #57e389;
    --red: #ff5c5c;
    --yellow: #ffd75f;
    --cyan: #57c7ff;
    --gpu0: #57e389;
    --gpu1: #57c7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", Consolas, "DejaVu Sans Mono", Menlo, monospace;
    font-size: 13px; line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  #live-dot { width: 9px; height: 15px; background: var(--green); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  header h1 { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  header .host-stats { display: flex; gap: 22px; margin-left: 10px; flex-wrap: wrap; }
  .host-stat { display: flex; gap: 8px; align-items: baseline; }
  .host-stat label { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  .host-stat b { font-size: 13px; font-weight: 600; color: #fff; }
  #host-model { display: inline-block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--green); }
  header .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  header .meta .clock { color: #fff; }

  main { padding: 16px; max-width: 1280px; margin: 0 auto; }

  /* ---------- panels (btop-style) ---------- */
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card { background: #000; border: 1px solid var(--border); padding: 12px 14px; }
  .card-head { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.5px; }
  .pnum { color: var(--red); font-size: 10px; vertical-align: super; margin-right: 2px; }

  /* utilization: LABEL [segments] value% */
  .util-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .util-line { display: flex; align-items: center; gap: 8px; }
  .util-line label { width: 38px; font-size: 12px; color: var(--muted); }
  .util-line b { width: 46px; text-align: right; font-size: 14px; font-weight: 700; }

  /* segmented bar (terminal blocks) */
  .seg { display: flex; gap: 2px; flex: 1; height: 12px; }
  .seg i { flex: 1; background: #141414; }
  .seg i.on { background: currentColor; }

  /* dot-leader rows: LABEL ......... value */
  .row { display: flex; align-items: baseline; gap: 6px; margin: 4px 0; }
  .row .lbl { color: var(--muted); white-space: nowrap; }
  .row .dots { flex: 1; border-bottom: 1px dotted #444; transform: translateY(-3px); }
  .row b { color: #fff; font-weight: 600; white-space: nowrap; }
  .row b.warn { color: var(--yellow); }
  .row b.hot { color: var(--red); }
  .row b.ok { color: var(--green); }

  .proc-row { margin-top: 8px; }
  .proc-row b { color: var(--cyan); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; margin-top: 10px; }

  /* ---------- charts ---------- */
  #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .chart-panel { background: #000; border: 1px solid var(--border); padding: 12px 14px; }
  .chart-panel h3 { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; letter-spacing: 0.5px; }
  .chart-box { position: relative; height: 190px; }

  /* ---------- footer ---------- */
  footer {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    border-top: 1px solid var(--border); margin-top: 16px;
    padding: 8px 16px; font-size: 12px; color: var(--muted);
  }
  footer .up { color: var(--green); }
  footer .ver { color: var(--yellow); }
  footer .right { margin-left: auto; }

  #status { padding: 40px; text-align: center; color: var(--muted); display: none; }
</style>
</head>
<body>
<header>
  <div id="live-dot"></div>
  <h1>LLM Dashboard</h1>
  <div class="host-stats">
    <div class="host-stat"><label>CPU</label><b id="host-cpu">&ndash;</b></div>
    <div class="host-stat"><label>RAM</label><b id="host-ram">&ndash;</b></div>
    <div class="host-stat"><label>MODEL</label><b id="host-model" title="">&ndash;</b></div>
  </div>
  <div class="meta"><span id="driver-meta">connecting&hellip;</span> &nbsp; <span class="clock" id="clock"></span></div>
</header>

<main>
  <div id="status">Waiting for first sample&hellip; (the backend needs ~1 s after start)</div>
  <section id="cards"></section>
  <section id="charts"></section>
</main>

<footer>
  <span class="up" id="uptime">up &ndash;</span>
  <span id="foot-gpus"></span>
  <span>refresh 1s</span>
  <span class="ver right">v0-stable</span>
</footer>

<script src="app.js"></script>
</body>
</html>
